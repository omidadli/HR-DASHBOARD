<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>هوشا — دستیار هوشمند غربالگری رزومه سیلانه سبز</title>
    <meta name="description" content="اپلیکیشن ساده و دوست‌داشتنی غربالگری رزومه: انتخاب دپارتمان، پرسش‌نامه چک‌باکسی هوشمند، تحلیل و دسته‌بندی رزومه‌ها در سه دسته مصاحبه شود/بررسی شود/رد شود با اولویت‌بندی و صفحه‌بندی، و بانک رزومه دپارتمان‌محور با فیلتر" />
    <meta property="og:title" content="هوشا — دستیار هوشمند غربالگری رزومه سیلانه سبز" />
    <meta property="og:description" content="اپلیکیشن ساده و دوست‌داشتنی غربالگری رزومه: انتخاب دپارتمان، پرسش‌نامه چک‌باکسی هوشمند، تحلیل و دسته‌بندی رزومه‌ها در سه دسته مصاحبه شود/بررسی شود/رد شود با اولویت‌بندی و صفحه‌بندی، و بانک رزومه دپارتمان‌محور با فیلتر" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#00C87B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/silaneh-logo.svg" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Vazirmatn-var.woff2" crossorigin />

    <!--
      Critical CSS — deliberately plain (no @layer / @property / color-mix).
      It must survive on old Safari/iOS where the bundled Tailwind v4 output is
      partially unsupported, and it must not depend on any third-party origin
      (the previous Google Fonts <link> was render-blocking and, when that host
      was slow or unreachable, the page stayed blank for tens of seconds).
    -->
    <style>
      @font-face {
        font-family: 'Vazirmatn';
        src: url('/fonts/Vazirmatn-var.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Vazirmatn';
        src: url('/fonts/Vazirmatn-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Vazirmatn';
        src: url('/fonts/Vazirmatn-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Vazirmatn';
        src: url('/fonts/Vazirmatn-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      html { background: #f6f8f6; }
      body {
        margin: 0;
        background-color: #f6f8f6;
        color: #121815;
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
        line-height: 1.6;
        min-height: 100vh;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f6f8f6;
        z-index: 9999;
        text-align: center;
        padding: 24px;
        direction: rtl;
        transition: opacity 0.3s ease-out;
      }
      #boot-screen.boot-fade-out {
        opacity: 0;
        pointer-events: none;
      }
      /* First visit professional design */
      .boot-logo-card {
        position: relative;
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(0, 200, 123, 0.28);
        border-radius: 20px;
        box-shadow: 0 12px 36px -6px rgba(0, 200, 123, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-logo-glow {
        position: absolute;
        inset: -8px;
        background: rgba(5, 229, 144, 0.15);
        filter: blur(14px);
        border-radius: 28px;
        z-index: -1;
        animation: boot-pulse 2.4s ease-in-out infinite alternate;
      }
      .boot-logo-svg {
        height: 60px;
        width: auto;
        display: block;
      }
      .boot-typing-box {
        min-height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: #1a2520;
      }
      .boot-typing-cursor {
        color: #00c87b;
        font-weight: 700;
        animation: boot-blink 0.8s step-start infinite;
      }
      .boot-progress-wrap {
        width: 170px;
        height: 4px;
        background: #e3e8e4;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 4px;
      }
      .boot-progress-bar {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #05e590, #00c87b, #00af6b);
        border-radius: 999px;
        animation: boot-progress-shimmer 1.5s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0% { opacity: 0.5; transform: scale(0.96); }
        100% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes boot-blink {
        50% { opacity: 0; }
      }
      @keyframes boot-progress-shimmer {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      /* Returning user lightweight ring */
      #boot-screen .boot-ring {
        width: 32px; height: 32px;
        border: 3px solid #d2f9e7;
        border-top-color: #00c87b;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      #boot-screen .boot-text {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: #4a554f;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }

      /* Shown instead of a silent blank page when JS/CSS cannot run. */
      #boot-fatal {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f8f6;
      }
      #boot-fatal.boot-shown { display: flex; }
      #boot-fatal .card {
        max-width: 460px;
        width: 100%;
        background: #fff;
        border: 1px solid #e3e8e4;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(16, 24, 20, 0.14);
      }
      #boot-fatal h1 { font-size: 15px; margin: 0 0 8px; color: #121815; }
      #boot-fatal p { font-size: 12.5px; margin: 0 0 10px; color: #4a554f; }
      #boot-fatal code {
        display: block;
        direction: ltr;
        text-align: left;
        font-size: 11px;
        background: #f0f3f1;
        border-radius: 8px;
        padding: 8px;
        margin: 0 0 14px;
        color: #73807a;
        word-break: break-word;
        max-height: 90px;
        overflow: auto;
      }
      #boot-fatal button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        background: #00c87b;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body class="bg-surface-0 text-text-1 font-sans antialiased selection:bg-brand/20 selection:text-brand min-h-screen">
    <div id="root"></div>

    <!-- First paint while the JS bundle downloads: professional branding for first visit, subtle for returning -->
    <div id="boot-screen"></div>

    <!-- Visible failure surface instead of an endless white screen. -->
    <div id="boot-fatal">
      <div class="card">
        <h1>هوشا نتوانست روی این مرورگر اجرا شود</h1>
        <p>
          اگر از آیفون یا آیپد استفاده می‌کنید، لطفاً iOS را به نسخه ۱۶.۴ یا بالاتر به‌روزرسانی کنید
          (Settings › General › Software Update) یا سایت را در کروم باز کنید.
        </p>
        <code id="boot-fatal-detail"></code>
        <button type="button" onclick="location.reload()">تلاش دوباره</button>
      </div>
    </div>

    <script>
      // Any uncaught failure during boot must be visible, not a silent blank page.
      (function () {
        var boot = document.getElementById('boot-screen');
        var fatal = document.getElementById('boot-fatal');
        var detail = document.getElementById('boot-fatal-detail');
        var failed = false;
        var watchdogTimer = null;

        var isFirstVisit = false;
        try {
          var stored = localStorage.getItem('seilaneh.app.user.v1');
          isFirstVisit = !stored;
        } catch (e) {
          isFirstVisit = true;
        }

        if (boot) {
          if (isFirstVisit) {
            boot.innerHTML =
              '<div class="boot-logo-card">' +
                '<div class="boot-logo-glow"></div>' +
                '<svg viewBox="0 0 500 360" fill="none" class="boot-logo-svg" style="aspect-ratio: 500/360;">' +
                  '<defs>' +
                    '<linearGradient id="bootNeonGrad" x1="14" y1="100" x2="476" y2="360" gradientUnits="userSpaceOnUse">' +
                      '<stop offset="0%" stop-color="#05E590" />' +
                      '<stop offset="45%" stop-color="#00C87B" />' +
                      '<stop offset="100%" stop-color="#00AF6B" />' +
                    '</linearGradient>' +
                    '<linearGradient id="bootDropGrad" x1="255" y1="65" x2="255" y2="200" gradientUnits="userSpaceOnUse">' +
                      '<stop offset="0%" stop-color="#05E590" />' +
                      '<stop offset="100%" stop-color="#00BA73" />' +
                    '</linearGradient>' +
                  '</defs>' +
                  '<path d="M 195 130 C 200 102, 218 92, 238 98 C 255 104, 270 115, 305 138 L 285 152 C 260 134, 238 124, 218 126 Z" fill="#009E60" />' +
                  '<path d="M 14 275 C 85 195, 165 155, 230 152 C 255 152, 280 156, 310 162 C 370 144, 425 124, 476 102 C 420 165, 350 250, 290 360 C 235 285, 120 270, 14 275 Z" fill="url(#bootNeonGrad)" />' +
                  '<path d="M 230 152 L 290 360" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9" />' +
                  '<path d="M 255 65 C 240 105, 205 150, 205 185 C 205 215, 227 238, 255 238 C 283 238, 305 215, 305 185 C 305 150, 270 105, 255 65 Z" fill="url(#bootDropGrad)" />' +
                  '<path d="M 235 150 C 230 165, 232 185, 240 195 C 242 198, 238 202, 235 200 C 225 188, 222 165, 228 148 C 230 145, 236 146, 235 150 Z" fill="#FFFFFF" opacity="0.85" />' +
                '</svg>' +
              '</div>' +
              '<div class="boot-typing-box">' +
                '<span id="boot-typing-text"></span><span class="boot-typing-cursor">|</span>' +
              '</div>' +
              '<div class="boot-progress-wrap">' +
                '<div class="boot-progress-bar"></div>' +
              '</div>';

            var textMsg = 'به هوشا خوش آمدید تا لحظاتی دیگر وارد می‌شوید';
            var typingEl = document.getElementById('boot-typing-text');
            var idx = 0;
            function runTypewriter() {
              if (typingEl && idx < textMsg.length) {
                typingEl.textContent += textMsg.charAt(idx);
                idx++;
                setTimeout(runTypewriter, 36);
              }
            }
            setTimeout(runTypewriter, 120);
          } else {
            boot.innerHTML =
              '<div class="boot-ring"></div>' +
              '<div class="boot-text">در حال بارگذاری هوشا…</div>';
          }
        }

        function hideBoot() {
          if (watchdogTimer) {
            clearTimeout(watchdogTimer);
            watchdogTimer = null;
          }
          if (boot) {
            boot.classList.add('boot-fade-out');
            setTimeout(function () {
              if (boot.parentNode) boot.parentNode.removeChild(boot);
            }, 280);
          }
        }

        function showFatal(message) {
          // If React has already mounted or boot succeeded, never show fatal error
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          if (failed) return;
          failed = true;
          if (watchdogTimer) {
            clearTimeout(watchdogTimer);
            watchdogTimer = null;
          }
          hideBoot();
          if (detail) detail.textContent = String(message || 'خطای نامشخص');
          if (fatal) fatal.className = 'boot-shown';
        }

        window.__hooshaBoot = { hide: hideBoot, fail: showFatal };

        window.addEventListener('error', function (e) {
          // Only surface failures that happened before React took over.
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          showFatal((e && (e.message || (e.error && e.error.message))) || 'خطای ناشناخته');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          var reason = e && e.reason;
          showFatal((reason && (reason.message || reason)) || 'خطای ناشناخته');
        });

        // Safe watchdog: only fires after 60s if React completely failed to mount.
        watchdogTimer = setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount === 0) {
            showFatal('بارگذاری برنامه بیش از حد طول کشید. لطفاً اتصال اینترنت را بررسی یا صفحه را مجدداً بارگذاری کنید.');
          }
        }, 60000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
