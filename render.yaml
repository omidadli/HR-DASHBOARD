# Render Blueprint — دستیار غربالگری رزومه سیلانه سبز
# داده‌ها روی دیسک سرویس (فایل JSON در پوشه data/) نگهداری می‌شوند؛
# برای حفظ دائمی داده‌ها هنگام دیپلوی، یک دیسک مانت‌شده روی ./data لازم است.

services:
  - type: web
    name: seilaneh-resume-screener
    env: node
    plan: starter
    region: oregon
    runtime: node
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: GEMINI_API_KEY
        sync: false
